server:
    port: 8086

spring:
    application:
        name: newsletter-service

    # ✅ Native Spring Boot 3.x way to import your .env file
    config:
        import: "optional:file:../.env[.properties]"

    # Database Configuration using variables from your .env
    datasource:
        url: ${NEWSLETTER_DB_URL:jdbc:mysql://localhost:3306/inkwell_newsletter}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        hikari:
            maximum-pool-size: 3
            minimum-idle: 1
            connection-timeout: 20000
            idle-timeout: 300000
            max-lifetime: 1800000

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        database-platform: org.hibernate.dialect.MySQLDialect
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect

    # 📧 Mail Server Configuration using secrets from .env
    mail:
        host: smtp.gmail.com
        port: 587
        username: ${EMAIL_USER}
        password: ${EMAIL_PASS}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
                        required: true

eureka:
    client:
        service-url:
            defaultZone: http://inkwell-eureka:8761/eureka/
    instance:
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${server.port}

# Enable debug logging for email troubleshooting
logging:
    level:
        org.springframework.mail: DEBUG

springdoc:
  api-docs:
    path: /newsletter/v3/api-docs
