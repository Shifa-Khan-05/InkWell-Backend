version: '3.8'
services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"   # Messaging port
      - "15672:15672" # Dashboard (Guest/Guest)
    container_name: inkwell-rabbitmq

  redis:
    image: redis:latest
    ports:
      - "6379:6379"
    container_name: inkwell-redis