server:
  port: 8085

spring:
  application:
    name: taxonomy-service
  config:
    import: optional:file:../.env[.properties]

  # ✅ Consistent with Post-Service for potential icon/asset uploads
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

  datasource:
    # ✅ Pulls from your .env using the exact keys provided
    url: ${TAXONOMY_DB}
    username: ${DB_USER}
    password: ${DB_PASS}

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: false
    instance-id: ${spring.application.name}:${server.port}
    hostname: localhost

management:
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always