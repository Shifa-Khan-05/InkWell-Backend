server:
    port: 8083

spring:
    config:
        import: optional:file:../.env[.properties]
    application:
        name: comment-service
    datasource:
        url: ${COMMENT_DB}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            maximum-pool-size: 3
            minimum-idle: 1
            connection-timeout: 20000
            idle-timeout: 300000
            max-lifetime: 1800000
    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        database-platform: org.hibernate.dialect.MySQLDialect
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
                format_sql: true

eureka:
    client:
        service-url:
            defaultZone: http://inkwell-eureka:8761/eureka/
    instance:
        # ✅ Change this to false so it uses 'localhost' instead of the network IP
        prefer-ip-address: true

springdoc:
  api-docs:
    path: /comments/v3/api-docs
