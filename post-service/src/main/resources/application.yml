server:
    port: 8082

spring:
    application:
        name: post-service

    config:
        import: optional:file:../.env[.properties]

    # ✅ Fix for 413 Error: Allow Post-Service to accept large images
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 10MB

    datasource:
        url: ${POST_DB_URL}
        username: ${DB_USER}
        password: ${DB_PASS}

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
    instance:
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${server.port}

management:
    endpoints:
        web:
            exposure:
                include: "*"
    endpoint:
        health:
            show-details: always

blog:
    wpm: 200
