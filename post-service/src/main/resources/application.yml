server:
    port: 8082

spring:
    application:
        name: post-service

    config:
        import: optional:file:../.env[.properties]

    datasource:
        url: ${POST_DB_URL}
        username: ${DB_USER}
        password: ${DB_PASS}

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
    # ✅ ADDITION 1: Unique ID for Admin Server tracking
    instance:
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${server.port}

# ✅ ADDITION 2: Required for Admin Server health status
management:
    endpoints:
        web:
            exposure:
                include: "*"
    endpoint:
        health:
            show-details: always

# Custom setting for read-time calculation
blog:
    wpm: 200 # Average reading speed