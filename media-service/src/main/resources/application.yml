server:
    port: 8087

spring:
    application:
        name: media-service
    config:
        import: optional:file:../.env[.properties]

    # ✅ Critical for large image uploads
    servlet:
        multipart:
            max-file-size: 15MB
            max-request-size: 15MB

    datasource:
        url: ${MEDIA_DB}
        username: ${DB_USER}
        password: ${DB_PASS}

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
    instance:
        prefer-ip-address: false
        instance-id: ${spring.application.name}:${server.port}
        hostname: localhost
