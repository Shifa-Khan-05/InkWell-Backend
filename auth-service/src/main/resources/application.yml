server:
    port: 8084
    forward-headers-strategy: framework

spring:
    application:
        name: auth-service

    config:
        import: optional:file:../.env[.properties]

    datasource:
        url: ${DB_URL}
        username: ${DB_USERNAME}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
        hikari:
            maximum-pool-size: 3
            minimum-idle: 1
            connection-timeout: 20000
            idle-timeout: 300000
            max-lifetime: 1800000

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        database-platform: org.hibernate.dialect.MySQLDialect
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect
                format_sql: true

    security:
        oauth2:
            client:
                registration:
                    google:
                        client-id: ${GOOGLE_CLIENT_ID}
                        client-secret: ${GOOGLE_CLIENT_SECRET}
                        scope:
                            - email
                            - profile

    # ✅ ADDITION 1: Support for profile image browsing/upload
    servlet:
        multipart:
            max-file-size: 5MB
            max-request-size: 5MB

jwt:
    secret: ${JWT_SECRET}
    expiration: 86400000

eureka:
    client:
        service-url:
            defaultZone: http://inkwell-eureka:8761/eureka/
    instance:
        prefer-ip-address: true
        # ✅ ADDITION 2: Unique ID for Admin Server tracking
        instance-id: ${spring.application.name}:${server.port}

# ✅ ADDITION 3: Required for Admin Server health status
management:
    endpoints:
        web:
            exposure:
                include: "*"
    endpoint:
        health:
            show-details: always

springdoc:
    api-docs:
        path: /auth/api-docs
    swagger-ui:
        path: /swagger-ui.html
