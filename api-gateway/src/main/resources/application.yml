server:
  port: 8081
  forward-headers-strategy: framework

spring:

  # =========================
  # APPLICATION NAME
  # =========================
  application:
    name: api-gateway

  # =========================
  # IMPORT ENV FILE
  # =========================
  config:
    import: optional:file:../.env[.properties]

  # =========================
  # WEBFLUX MEMORY LIMIT
  # =========================
  codec:
    max-in-memory-size: 50MB

  # =========================
  # SPRING CLOUD GATEWAY
  # =========================
  cloud:

    gateway:

      # =========================
      # GLOBAL FILTERS
      # =========================
      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      # =========================
      # GLOBAL CORS
      # =========================
      globalcors:

        add-to-simple-url-handler-mapping: true

        cors-configurations:

          '[/**]':

            allowedOrigins:
              - "https://inkwell-blogging.netlify.app"
              - "https://3.108.190.193.nip.io"
              - "http://3.108.190.193.nip.io"
              - "http://localhost:5173"
              - "http://localhost:5174"

            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH

            allowedHeaders: "*"

            allowCredentials: true

      # =========================
      # MICROSERVICE ROUTES
      # =========================
      routes:

        # =========================
        # WEBSITE CONTROLLER
        # =========================
        - id: website-controller
          uri: lb://WEBSITE-CONTROLLER
          predicates:
            - Path=/api/**

        # =========================
        # AUTH SERVICE
        # =========================
        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**,/uploads/**,/oauth2/**,/login/**

        # =========================
        # POST SERVICE
        # =========================
        - id: post-service
          uri: lb://POST-SERVICE
          predicates:
            - Path=/posts/**,/post_uploads/**

        # =========================
        # POST IMAGE ACCESS
        # =========================
        - id: post-service-uploads
          uri: lb://POST-SERVICE
          predicates:
            - Path=/post_uploads/**

        # =========================
        # COMMENT SERVICE
        # =========================
        - id: comment-service
          uri: lb://COMMENT-SERVICE
          predicates:
            - Path=/comments/**

        # =========================
        # TAXONOMY SERVICE
        # =========================
        - id: taxonomy-service
          uri: lb://TAXONOMY-SERVICE
          predicates:
            - Path=/taxonomy/**

        # =========================
        # MEDIA SERVICE
        # =========================
        - id: media-service
          uri: lb://MEDIA-SERVICE
          predicates:
            - Path=/media/**

        # =========================
        # NEWSLETTER SERVICE
        # =========================
        - id: newsletter-service
          uri: lb://NEWSLETTER-SERVICE
          predicates:
            - Path=/newsletter/**

        # =========================
        # PAYMENT SERVICE
        # =========================
        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/payments/**

        # =========================
        # NOTIFICATION SERVICE
        # =========================
        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notifications/**

# =========================
# JWT CONFIGURATION
# =========================
jwt:
  secret: ${JWT_SECRET}

# =========================
# SWAGGER AGGREGATION
# =========================
springdoc:

  api-docs:
    enabled: true

  swagger-ui:

    enabled: true

    path: /swagger-ui.html

    urls:

      - name: Auth Service
        url: /auth/api-docs

      - name: Post Service
        url: /posts/v3/api-docs

      - name: Comment Service
        url: /comments/v3/api-docs

      - name: Taxonomy Service
        url: /taxonomy/v3/api-docs

      - name: Notification Service
        url: /notifications/v3/api-docs

      - name: Payment Service
        url: /payments/v3/api-docs

      - name: Newsletter Service
        url: /newsletter/v3/api-docs

      - name: Media Service
        url: /media/v3/api-docs

# =========================
# EUREKA CONFIGURATION
# =========================
eureka:

  client:

    service-url:

      # Local fallback + Docker support
      defaultZone: ${EUREKA_URL:http://localhost:8761/eureka/}

  instance:
    prefer-ip-address: true
    instance-id: ${spring.application.name}:${server.port}

# =========================
# ACTUATOR CONFIGURATION
# =========================
management:

  endpoints:

    web:
      exposure:
        include: "*"

  endpoint:

    health:
      show-details: always

# =========================
# LOGGING
# =========================
logging:

  level:

    org.springframework.cloud.gateway: INFO
    reactor.netty.http.client: INFO
    org.springframework.security: INFO
    com.apigateway: DEBUG
