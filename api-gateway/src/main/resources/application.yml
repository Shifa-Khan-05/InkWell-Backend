server:
    port: 8080

spring:
    application:
        name: api-gateway
    cloud:
        gateway:
            server:
                webflux: # ✅ REQUIRED for Spring Boot 3.5.13
                    globalcors:
                        add-to-simple-url-handler-mapping: true
                        cors-configurations:
                            "[/**]":
                                allowedOrigins: "http://localhost:5173"
                                allowedMethods: "*"
                                allowedHeaders: "*"
                                allowCredentials: true
                    discovery:
                        locator:
                            enabled: true
                    routes:
                        - id: auth-service
                          uri: lb://AUTH-SERVICE
                          predicates:
                              - Path=/auth/**
                        - id: post-service
                          uri: lb://POST-SERVICE
                          predicates:
                              - Path=/posts/**

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
