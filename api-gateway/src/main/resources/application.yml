server:
    port: 8080

spring:
    application:
        name: api-gateway
    # ✅ Fix for 413 Error: Allow large file uploads through Gateway
    servlet:
        multipart:
            max-file-size: 10MB
            max-request-size: 10MB
    cloud:
        gateway:
            server:
                webflux:
                    globalcors:
                        add-to-simple-url-handler-mapping: true
                        cors-configurations:
                            "[/**]":
                                allowedOrigins: "http://localhost:5173"
                                allowedMethods: "*"
                                allowedHeaders: "*"
                                allowCredentials: true
                    discovery:
                        locator:
                            enabled: true
                    routes:
                        - id: auth-service
                          uri: lb://AUTH-SERVICE
                          predicates:
                              - Path=/auth/**
                        - id: post-service
                          uri: lb://POST-SERVICE
                          predicates:
                              # ✅ Gateway now routes both API calls and Static Images
                              - Path=/posts/**, /post_uploads/**
                                filters:- PreserveHostHeader

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
