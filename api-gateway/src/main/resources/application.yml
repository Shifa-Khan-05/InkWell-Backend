server:
    port: 8080

spring:
    application:
        name: api-gateway
    cloud:
        gateway:
            default-filters:
                - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials
            globalcors:
                add-to-simple-url-handler-mapping: true
                cors-configurations:
                    "[/**]":
                        allowedOrigins: "http://localhost:5173"
                        allowedMethods: "*"
                        allowedHeaders: "*"
                        allowCredentials: true
            routes:
                - id: auth-service
                  uri: lb://AUTH-SERVICE
                  predicates:
                      - Path=/auth/**

                - id: post-service
                  uri: lb://POST-SERVICE
                  predicates:
                      - Path=/posts/**

                - id: comment-service
                  uri: lb://COMMENT-SERVICE
                  predicates:
                      - Path=/comments/**

                - id: taxonomy-service
                  uri: lb://TAXONOMY-SERVICE
                  predicates:
                      - Path=/taxonomy/**

                - id: media-service
                  uri: lb://MEDIA-SERVICE
                  predicates:
                      - Path=/media/**

                # ✅ MATCHED: Changed to uppercase to match Eureka standards
                - id: newsletter-service
                  uri: lb://NEWSLETTER-SERVICE
                  predicates:
                      - Path=/newsletter/**
                - id: payment-service
                  uri: lb://PAYMENT-SERVICE
                  predicates:
                      - Path=/payments/**
                - id: notification-service
                  uri: lb://NOTIFICATION-SERVICE
                  predicates:
                      - Path=/notifications/**

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
