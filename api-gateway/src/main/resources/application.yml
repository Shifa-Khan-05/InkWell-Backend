server:
  port: 8081

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      default-filters:
        # Prevents "Multiple CORS header" errors in browsers
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
      globalcors:
        add-to-simple-url-handler-mapping: true
        cors-configurations:
          '[/**]':
            allowedOrigins: 
              - "http://localhost:5173"
              - "http://localhost:5174"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
      routes:
        - id: website-controller
          uri: lb://WEBSITE-CONTROLLER
          predicates:
            - Path=/api/**

        - id: auth-service
          uri: lb://AUTH-SERVICE
          predicates:
            - Path=/auth/**, /uploads/**

        - id: post-service
          uri: lb://POST-SERVICE
          predicates:
            - Path=/posts/**

        - id: post-service-uploads
          uri: lb://POST-SERVICE
          predicates:
            - Path=/post_uploads/**

        - id: comment-service
          uri: lb://COMMENT-SERVICE
          predicates:
            - Path=/comments/**

        - id: taxonomy-service
          uri: lb://TAXONOMY-SERVICE
          predicates:
            - Path=/taxonomy/**

        - id: media-service
          uri: lb://MEDIA-SERVICE
          predicates:
            - Path=/media/**

        - id: newsletter-service
          uri: lb://NEWSLETTER-SERVICE
          predicates:
            - Path=/newsletter/**

        - id: payment-service
          uri: lb://PAYMENT-SERVICE
          predicates:
            - Path=/payments/**

        - id: notification-service
          uri: lb://NOTIFICATION-SERVICE
          predicates:
            - Path=/notifications/**

# Swagger Aggregation Config for Microservices
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    urls:
      - name: 1. Auth Service
        url: /auth/api-docs
      - name: 2. Post Service
        url: /posts/v3/api-docs
      - name: 3. Comment Service
        url: /comments/v3/api-docs
      - name: 4. Taxonomy Service
        url: /taxonomy/v3/api-docs
      - name: 5. Notification Service
        url: /notifications/v3/api-docs
      - name: 6. Payment Service
        url: /payments/v3/api-docs
      - name: 7. Newsletter Service
        url: /newsletter/v3/api-docs
      - name: 8. Media Service
        url: /media/v3/api-docs

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
  instance:
    prefer-ip-address: true