server:
  port: 9001

spring:
  application:
    name: website-controller
  config:
    import: optional:file:../.env[.properties]

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/

# To see the Feign calls in the console
logging:
  level:
    com.websitecontroller.client: DEBUG