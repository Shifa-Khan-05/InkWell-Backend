server:
    port: 8090

spring:
    application:
        name: notification-service

    config:
        import: "optional:file:../.env[.properties]"

    datasource:
        url: ${NOTIFICATION_DB_URL:jdbc:mysql://localhost:3306/inkwell_notifications}
        username: ${DB_USER}
        password: ${DB_PASS}

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect

    mail:
        host: smtp.gmail.com
        port: 587
        username: ${EMAIL_USER}
        password: ${EMAIL_PASS}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
                        required: true
                    # ✅ Critical: Added timeouts to prevent 500 errors if Gmail is slow
                    connectiontimeout: 5000
                    timeout: 5000
                    writetimeout: 5000

# ✅ Added to prevent the 125-second health check hang seen in your logs
management:
    health:
        mail:
            enabled: false

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
    instance:
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${server.port}

logging:
    level:
        org.springframework.mail: DEBUG
        com.notificationservice: DEBUG