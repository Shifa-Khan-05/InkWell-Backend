server:
    port: 8090

spring:
    application:
        name: notification-service

    # ✅ Native Spring Boot 3.x way to import your shared .env file
    config:
        import: "optional:file:../.env[.properties]"

    # Database Configuration for Notifications
    datasource:
        url: ${NOTIFICATION_DB_URL:jdbc:mysql://localhost:3306/inkwell_notifications}
        username: ${DB_USER}
        password: ${DB_PASS}

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                dialect: org.hibernate.dialect.MySQLDialect

    # 📧 Mail Server Configuration (Shared with Newsletter logic)
    mail:
        host: smtp.gmail.com
        port: 587
        username: ${EMAIL_USER}
        password: ${EMAIL_PASS}
        properties:
            mail:
                smtp:
                    auth: true
                    starttls:
                        enable: true
                        required: true

eureka:
    client:
        service-url:
            defaultZone: http://localhost:8761/eureka/
    instance:
        prefer-ip-address: true
        instance-id: ${spring.application.name}:${server.port}

# Enable logging to track notification dispatch
logging:
    level:
        org.springframework.mail: DEBUG
        com.notificationservice: DEBUG
