<!DOCTYPE html>
<html>
<head>
    <style>
        .container { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; max-width: 600px; margin: auto; background-color: #0f172a; color: white; border-radius: 12px; overflow: hidden; }
        .header { padding: 40px 20px; text-align: center; background-color: #1e293b; }
        .logo { font-size: 28px; font-weight: bold; color: #f59e0b; letter-spacing: 1px; }
        .badge { background-color: #065f46; color: #34d399; padding: 6px 16px; border-radius: 20px; font-size: 14px; margin-bottom: 20px; display: inline-block; }
        .content { padding: 40px 30px; text-align: center; }
        .content h1 { font-size: 32px; margin-bottom: 20px; }
        .content p { color: #94a3b8; line-height: 1.6; margin-bottom: 30px; }
        .button { background-color: #f59e0b; color: #0f172a; padding: 14px 28px; border-radius: 8px; text-decoration: none; font-weight: bold; display: inline-block; }
        .footer { padding: 20px; text-align: center; font-size: 12px; color: #475569; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="logo">InkWell</div>
        </div>
        <div class="content">
            <div class="badge">Action Processed</div>
            <p>Hi InkWell Platform Alert,</p>
            <h1>[[${title}]]</h1>
            <p>[[${message}]]</p>
            <a href="[[${actionUrl}]]" class="button">Go to Manuscript</a>
        </div>
        <div class="footer">
            &copy; 2026 InkWell Microservices Framework • Bhopal, India
        </div>
    </div>
</body>
</html>
